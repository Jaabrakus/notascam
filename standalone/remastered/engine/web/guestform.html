<form action="join" id="guest"><input class="gnew" name="name" id="gname" aria-label="Your name" maxlength="24" pattern="[A-Za-z0-9][A-Za-z0-9 _\-]{0,23}" required><button class="plate gnew" id="gplay">Play</button><button type="button" class="plate" id="gopen" hidden>Play</button><p class="detail" id="gnote">Your village is saved in this browser. Change the name if you like.</p></form>

<script>/* a name ready to go, changeable (the owner, 11-01: "Pre-filled, changeable"); then the race picker comes first */(function(){var a=["Bran","Cor","Dun","Ael","Fen","Gar","Hal","Isen","Kel","Lor","Mor","Nor","Ost","Ran","Sel","Tor","Ul","Var","Wen","Yr"],b=["dor","wyn","ric","mar","ion","gar","nell","ath","oc","wen","mund","dric","ara","ost","eth","ald"],n=document.getElementById("gname");if(n&&!n.value)n.value=a[Math.floor(Math.random()*a.length)]+b[Math.floor(Math.random()*b.length)]})();
/* A slot is {c: the keep code the HUD sends (Guests.dm RmGuestBrowser), n: its name, r: race, p: people, w: "Fall of 499" (the HUD
   writes r/p/w, 027), t: last played}, kept in rmGuestSlots; the one chosen goes into rmGuestBrowser, which the HUD reads. Forget
   only drops it from this browser (its village stays parked on the server, unplayable from here). */
(function(){var MAX=10,RACES=["Human","Dwarf","Elf","Orc","Goblin","Lizardman","Frogman","Kobold","Ratman","Dragon","Spider","Devourer","Svartalfar","Illithid"],
PL={Dwarf:"Dwarves",Elf:"Elves",Lizardman:"Lizardmen",Frogman:"Frogmen",Ratman:"Ratmen",Svartalfar:"Svartalfar"},
$=function(i){return document.getElementById(i)},f=$("guest"),n=$("gname"),play=$("gplay"),open=$("gopen"),note=$("gnote"),panel=$("gpanel"),rows=$("grows"),sheet=$("gsheet"),ctl=$("controls"),
S=[],ok=true,cont=false,sel=0;
if(panel&&ctl)ctl.appendChild(panel);
function code(){var r=new Uint8Array(16);crypto.getRandomValues(r);return Array.from(r,function(x){return x.toString(16).padStart(2,"0")}).join("")}
function valid(c){return /^[0-9a-f]{32}$/.test(c||"")}
function save(){try{localStorage.setItem("rmGuestSlots",JSON.stringify(S))}catch(e){}}
try{S=JSON.parse(localStorage.getItem("rmGuestSlots")||"[]");if(!Array.isArray(S))S=[];S=S.filter(function(s){return s&&valid(s.c)});var old=localStorage.getItem("rmGuestBrowser");if(valid(old)&&!S.some(function(s){return s.c===old}))S.push({c:old,n:"",t:0});save()}catch(e){ok=false;S=[]}
S.sort(function(x,y){return (y.t||0)-(x.t||0)});
function okName(v){var keep=n.value;n.value=v||"";var g=!!v&&n.checkValidity();n.value=keep;return g}
function plural(r,p){return p===1?r:(PL[r]||r+"s")}
function facts(s){if(!s.r&&!s.p)return "No company yet";var t="Your company: "+(s.p||0)+" "+(s.r?plural(s.r,s.p):(s.p===1?"person":"people"));return s.w?t+" \u00b7 "+s.w:t}
function when(t){if(!t)return "";var d=new Date(t),now=new Date(),hm=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"),y=new Date(now);y.setDate(now.getDate()-1);
 if(d.toDateString()===now.toDateString())return "Today, "+hm;if(d.toDateString()===y.toDateString())return "Yesterday, "+hm;
 return d.toLocaleDateString("en-US",d.getFullYear()===now.getFullYear()?{month:"short",day:"numeric"}:{month:"short",day:"numeric",year:"numeric"})}
function go(s){cont=true;if(!okName(s.n))s.n=n.value;n.value=s.n;s.t=Date.now();try{localStorage.setItem("rmGuestBrowser",s.c)}catch(e){}save();f.submit()}
function draw(){rows.replaceChildren();S.forEach(function(s,i){var b=document.createElement("button");b.type="button";b.className="grow"+(i===sel?" on":"");b.setAttribute("role","option");b.setAttribute("aria-selected",i===sel?"true":"false");
 var k=RACES.indexOf(s.r),pic=document.createElement("span");pic.className="gpic"+(k<0?" none":"");if(k<0)pic.textContent="\u2691";else pic.style.setProperty("--i",k);
 var tx=document.createElement("span");tx.className="gtext";var nm=document.createElement("b");nm.textContent=s.n||"Your village";var fc=document.createElement("span");fc.textContent=facts(s);tx.append(nm,fc);
 var wh=document.createElement("span");wh.className="gwhen";var w=when(s.t);if(w){wh.textContent=w;var l=document.createElement("small");l.textContent="last played";wh.append(l)}
 b.append(pic,tx,wh);b.onclick=function(){sel=i;draw();rows.children[i].focus()};b.ondblclick=function(){go(s)};rows.append(b)});
 var none=!S.length;$("gcont").disabled=$("gren").disabled=$("gfor").disabled=none;$("gnewc").disabled=S.length>=MAX;$("gnewc").title=S.length>=MAX?"All "+MAX+" slots are used: forget one to start another":""}
function sheetOf(text,input,label,warn,done){sheet.replaceChildren();sheet.hidden=false;var p=document.createElement("p");p.textContent=text;sheet.append(p);var inp=null;
 if(input!==null){inp=document.createElement("input");inp.maxLength=24;inp.value=input;inp.setAttribute("aria-label","Name");sheet.append(inp)}
 var y=document.createElement("button");y.type="button";y.className="gb "+(warn?"warn":"go");y.textContent=label;var c=document.createElement("button");c.type="button";c.className="gb";c.textContent="Cancel";sheet.append(y,c);
 function fin(){sheet.hidden=true;sheet.replaceChildren()}
 y.onclick=function(){if(inp&&!okName(inp.value.trim())){p.textContent="A name starts with a letter or digit: letters, digits, spaces, _ and - (24 at most).";inp.focus();return}var r=done(inp&&inp.value.trim());if(r!==false)fin()};c.onclick=fin;
 sheet.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();y.onclick()}else if(e.key==="Escape"){e.preventDefault();fin()}};(inp||y).focus();if(inp)inp.select()}
function show(on){panel.hidden=!on;ctl.classList.toggle("glist",on);f.hidden=on;sheet.hidden=true;if(on){draw();var r=rows.children[sel];if(r)r.focus()}else open.focus()}
$("gcont").onclick=function(){if(S[sel])go(S[sel])};
$("gnewc").onclick=function(){sheetOf("Name your new character. It starts its own village.",n.value,"Start",false,function(v){cont=false;n.value=v;var s={c:code(),n:v,t:Date.now()};S.unshift(s);save();try{localStorage.setItem("rmGuestBrowser",s.c)}catch(e){}cont=true;f.submit()})};
$("gren").onclick=function(){var s=S[sel];if(s)sheetOf("Rename "+(s.n||"this character")+":",s.n||n.value,"Rename",false,function(v){s.n=v;save();draw()})};
$("gfor").onclick=function(){var s=S[sel];if(s)sheetOf("Forget "+(s.n||"this character")+"? This browser won't be able to play that village again.",null,"Forget",true,function(){S.splice(sel,1);save();try{if(localStorage.getItem("rmGuestBrowser")===s.c)localStorage.removeItem("rmGuestBrowser")}catch(e){}sel=Math.max(0,Math.min(sel,S.length-1));if(!S.length){show(false);mode()}else draw()})};
$("gback").onclick=function(){show(false)};
rows.onkeydown=function(e){if(!S.length)return;if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();sel=Math.max(0,Math.min(S.length-1,sel+(e.key==="ArrowDown"?1:-1)));draw();rows.children[sel].focus()}else if(e.key==="Enter"){e.preventDefault();go(S[sel])}};
