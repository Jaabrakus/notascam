<form action="join" id="guest"><input name="name" id="gname" aria-label="Your name" maxlength="24" pattern="[A-Za-z0-9][A-Za-z0-9 _\-]{0,23}" required><button class="plate">Play</button><p class="detail">Your village is saved in this browser. Change the name if you like.</p></form><script>/* a name ready to go, changeable (the owner, 11-01: "Pre-filled, changeable"); then the race picker comes first */(function(){var a=["Bran","Cor","Dun","Ael","Fen","Gar","Hal","Isen","Kel","Lor","Mor","Nor","Ost","Ran","Sel","Tor","Ul","Var","Wen","Yr"],b=["dor","wyn","ric","mar","ion","gar","nell","ath","oc","wen","mund","dric","ara","ost","eth","ald"],n=document.getElementById("gname");if(n&&!n.value)n.value=a[Math.floor(Math.random()*a.length)]+b[Math.floor(Math.random()*b.length)]})();
/* the page's own options in this address (such as ?overlay) go along with the guest too */(function(){var f=document.getElementById("guest");location.search.replace(/^\?/,"").split("&").forEach(function(kv){if(!kv)return;var i=kv.indexOf("="),k=decodeURIComponent(i<0?kv:kv.slice(0,i));if(k==="name"||k==="token")return;var h=document.createElement("input");h.type="hidden";h.name=k;h.value=i<0?"":decodeURIComponent(kv.slice(i+1));f.appendChild(h)})})();</script>
