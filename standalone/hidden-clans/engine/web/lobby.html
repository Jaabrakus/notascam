<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join</title>
<style>
html,body{height:100%;margin:0;background:#141210;color:#e8dcc0;font:16px/1.4 Georgia,serif}
body{display:flex;align-items:center;justify-content:center;padding:0 16px;box-sizing:border-box}
form{width:100%;max-width:340px;text-align:center}
h1{font-weight:normal;letter-spacing:.06em;margin:0 0 .8em}
input{width:100%;box-sizing:border-box;background:#0f0d0b;color:#eee3c8;border:1px solid #6b5a3a;border-radius:4px;padding:8px 10px;font:inherit}
button{margin-top:12px;background:#4a3a22;color:#f3e9d2;border:1px solid #8a7446;border-radius:4px;padding:8px 22px;font:inherit;cursor:pointer}
button:hover{background:#5d4a2b}
</style></head>
<body><form action="join"><h1>Join the world</h1>
<input name="name" placeholder="Your name" maxlength="30" pattern="[A-Za-z0-9][A-Za-z0-9 _\-]{0,29}" autofocus required>
<button>Join</button></form>
<script>/* the page's own options in this address (such as ?overlay) go along to the game */
(function(){var f=document.forms[0];location.search.replace(/^\?/,'').split('&').forEach(function(kv){if(!kv)return;var i=kv.indexOf('='),k=decodeURIComponent(i<0?kv:kv.slice(0,i));
  if(k==='name')return;var h=document.createElement('input');h.type='hidden';h.name=k;h.value=i<0?'':decodeURIComponent(kv.slice(i+1));f.appendChild(h)})})();</script>
</body></html>
