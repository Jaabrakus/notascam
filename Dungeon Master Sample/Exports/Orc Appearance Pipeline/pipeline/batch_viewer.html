<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orc appearance batch</title>
<style>:root{color-scheme:dark}body{font:15px system-ui;background:#262a2e;color:#edf0e9;max-width:1250px;padding:20px;margin:auto}p{color:#cbd2c6;line-height:1.5}a{color:#c5e8a7}.controls{display:flex;gap:15px;flex-wrap:wrap;align-items:center;position:sticky;top:0;background:#262a2ef5;padding:15px 0;z-index:2}button,select{font:inherit;padding:8px;background:#3b4248;color:white;border:1px solid #64725c}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card{background:#444952;text-align:center;border-radius:6px;padding:8px}canvas{width:100%;image-rendering:pixelated}section{margin-bottom:30px}h2{font-size:19px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}</style>
<h1>Orc appearance batch</h1><p>One approved animation, copied colors and donor overlays. Toggle details to compare the palette-only body. Each variant has separate front/back overlay files. These are appearance previews for visual review.</p>
<div class="controls"><button id="play">Pause</button><button id="step">Next pose</button><label><input id="details" type="checkbox" checked> Horns, markings and tails</label><span id="phase"></span><a href="comparison.png">Ready-pose comparison</a></div><main id="list"></main><p id="error"></p>
<script>const data=/*CONFIG*/,views=[];let phase=0,playing=true,last=0,elapsed=0;
for(const name of data.variants){const section=document.createElement('section'),h=document.createElement('h2'),grid=document.createElement('div');h.textContent=name;grid.className='grid';section.append(h,grid);document.querySelector('#list').append(section);const images={};for(const kind of ['composite','palette-only']){const im=new Image();im.src=name+'/'+name.toLowerCase()+'/'+kind+'.png';im.onerror=()=>document.querySelector('#error').textContent='Could not load '+im.src;images[kind]=im;}
['South','North','East','West'].forEach((direction,d)=>{const card=document.createElement('div'),label=document.createElement('div'),canvas=document.createElement('canvas');canvas.width=314;canvas.height=314;card.className='card';label.textContent=direction;card.append(label,canvas);grid.append(card);views.push({d,canvas,images});});}
function draw(){for(const v of views){const g=data.grid,x=g.xEdges[v.d],y=g.yEdges[phase],w=g.xEdges[v.d+1]-x,h=g.yEdges[phase+1]-y;const im=v.images[document.querySelector('#details').checked?'composite':'palette-only'],ctx=v.canvas.getContext('2d');ctx.clearRect(0,0,314,314);ctx.imageSmoothingEnabled=false;if(im.complete&&im.naturalWidth)ctx.drawImage(im,x,y,w,h,0,0,w,h);}document.querySelector('#phase').textContent=(phase+1)+' / 4';}
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play';};document.querySelector('#step').onclick=()=>{playing=false;document.querySelector('#play').textContent='Play';phase=(phase+1)%4;draw();};document.querySelector('#details').onchange=draw;
function tick(t){if(last&&playing){elapsed+=Math.min(t-last,100);if(elapsed>240){phase=(phase+1)%4;elapsed=0;}}last=t;draw();requestAnimationFrame(tick);}requestAnimationFrame(tick);</script></html>
